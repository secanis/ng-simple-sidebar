@if (configuration$ | async; as conf) {
    <div
        class="dock"
        [ngClass]="{ 'dock-open': isOpen$ | async, 'dock-mobile': conf.mobile }"
        [ngStyle]="dockStyle$ | async"
    >
        @if (conf.mobile && conf.mobileTitle) {
            <span>{{ conf.mobileTitle }}</span>
        }

        <!-- default items, like open/bottom buttons -->
        <div class="sidebar-header">
            @if ((isOpen$ | async) && conf.closeIcon) {
                <i
                    class="menu-opener pointer"
                    [class]="conf.closeIcon"
                    (click)="closeSidebar()"
                ></i>
            }
            @if ((isOpen$ | async) === false && conf.openIcon) {
                <i
                    class="menu-opener pointer"
                    [class]="conf.openIcon"
                    (click)="openSidebar()"
                ></i>
            }
        </div>
        <lib-sidebar-container
            [configuration]="conf"
            [itemsBottom]="(itemsBottom$ | async) || []"
            [itemsTop]="(itemsTop$ | async) || []"
            [isOpen]="(isOpen$ | async) || false"
            [colors]="(colors$ | async)!"
            [ngStyle]="sidedbarStyle$ | async"
            (closeDock)="closeSidebar()"
        ></lib-sidebar-container>
    </div>
}
